<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url={{ url }}">
    <link rel="canonical" href="{{ url }}">
    <title>Redirecting</title>
    <script>location.replace({{ url|tojson }})</script>
</head>
<body>
    <p>Redirecting to <a href="{{ url }}">{{ url }}</a></p>
</body>
</html>
