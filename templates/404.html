{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block description %}The page you're looking for doesn't exist.{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <h1 style="font-size: 120px; margin: 0; color: #333;">404</h1>
    <h2 style="font-size: 32px; margin: 20px 0; color: #666;">Page Not Found</h2>
    <p style="font-size: 18px; margin: 20px 0; color: #888;">
        Sorry, the page you're looking for doesn't exist or has been moved.
    </p>
    <p style="margin-top: 40px;">
        <a href="{{ base_path }}/" style="padding: 12px 24px; background: #333; color: white; text-decoration: none; border-radius: 4px;">Go Home</a>
    </p>
</div>
{% endblock %}
