<!-- htmlhint doctype-first:false -->
{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block description %}Terence Mahlatini's corner of the internet.{% endblock %}

{% block content %}
<section class="home-intro">
    <img src="{{ url_for('static', filename='images/profile3.JPG') }}" alt="Terence Mahlatini" class="profile-image">
    <div class="article-content">
        {{ index_card.content | safe }}
    </div>
</section>

<section class="recent-posts">
    <h2>Recent posts</h2>
    <ul>
        {% for post in recent_posts %}
        <li><a href="{{ url_for('post', slug=post.slug) }}">{{ post.title }}</a></li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
