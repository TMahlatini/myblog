<!-- htmlhint doctype-first:false -->
{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article>
    <h1>{{ post.title }}</h1>
    {% if post.date %}
    <div class="meta">
        <time class="date" datetime="{{ post.date.strftime('%Y-%m-%d') }}">{{ post.date.strftime('%B %d, %Y') }}</time>
    </div>
    {% endif %}
    <div class="content">
        {{ post.content|safe }}
    </div>
    <p class="back-link"><a href="{{ url_for('blog') }}">← All posts</a></p>
</article>
{% endblock %}
