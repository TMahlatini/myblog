<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}Terence Mahlatini's corner of the internet.{% endblock %}">
    <title>{% block title %}Blog - Terence Mahlatini{% endblock %}</title>
    <script>
        // Apply saved theme immediately to prevent flash
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header>
        <button class="menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="main-navigation">
            <span class="menu-toggle__bar"></span>
            <span class="menu-toggle__bar"></span>
            <span class="menu-toggle__bar"></span>
        </button>
        <nav id="main-navigation" class="header-menu" aria-label="Main navigation">
            <a href="{{ url_for('index') }}" class="header-menu__item {% if current_path == url_for('index') %}header-menu__item--active{% endif %}" aria-current="{% if current_path == url_for('index') %}page{% else %}false{% endif %}">Home</a>
            <a href="{{ url_for('blog') }}" class="header-menu__item {% if current_path == url_for('blog') %}header-menu__item--active{% endif %}" aria-current="{% if current_path == url_for('blog') %}page{% else %}false{% endif %}">Blog</a>
            <a href="{{ url_for('now') }}" class="header-menu__item {% if current_path == url_for('now') %}header-menu__item--active{% endif %}" aria-current="{% if current_path == url_for('now') %}page{% else %}false{% endif %}">Now</a>
        </nav>
    </header>

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer>
        {% block footer_content %}
        <span class="theme-toggle" role="button" tabindex="0" aria-label="Switch to dark mode">
            <span class="theme-toggle__text theme-toggle__text--light">Light Mode</span>
            <span class="theme-toggle__text theme-toggle__text--dark">Dark Mode</span>
        </span>
        {% endblock %}
    </footer>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
    <!-- Add before line 47 (before closing </body> tag) -->
    <script data-goatcounter="https://mahlatini.goatcounter.com/count"
    async src="//gc.zgo.at/count.js"></script>
</body>
</html>
